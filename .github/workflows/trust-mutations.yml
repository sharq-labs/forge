name: Trust Mutations

on:
  workflow_dispatch:

concurrency:
  group: trust-mutations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp,oracles]"
      - name: Run trust-boundary mutations
        run: >
          python -X utf8 benchmarks/trust_hardening/audit/mutations.py
          --json trust_mutation_results.json
      - name: Show assurance result
        if: always()
        run: |
          if [ -f trust_mutation_results.json ]; then
            cat trust_mutation_results.json
          else
            echo "trust_mutation_results.json was not produced"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trust-mutation-assurance-${{ github.sha }}
          path: trust_mutation_results.json
          if-no-files-found: warn
          retention-days: 90
