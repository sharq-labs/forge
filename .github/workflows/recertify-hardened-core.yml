          mapfile -t ids < "${RUNNER_TEMP}/formal-mutation-ids.txt"
          python -X utf8 tests/mutation_guards.py "${RUNNER_TEMP}/formal-mutations-2" "${ids[@]}" 2>&1 \
            | tee "${RUNNER_TEMP}/formal-mutations-2.log"
      - name: Record formal mutation shard digest
        id: digest
        shell: bash
        run: |
          echo "log_sha256=$(sha256sum "${RUNNER_TEMP}/formal-mutations-2.log" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload formal mutation shard evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-formal-mutations-2-${{ needs.classify.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/formal-mutation-ids.txt
            ${{ runner.temp }}/formal-mutations-2.log
          retention-days: 90

  formal_mutations_3:
    needs: classify
    if: needs.classify.outputs.mode == 'source'
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.select.outputs.count }}
      log_sha256: ${{ steps.digest.outputs.log_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp,oracles]"
      - name: Select formal mutation shard 3/4
        id: select
        env:
          SHARD_INDEX: "3"
          SHARD_COUNT: "4"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "${RUNNER_TEMP}/formal-mutation-ids.txt"
          import os
          import runpy

          namespace = runpy.run_path("tests/mutation_guards.py")
          mutations = namespace["MUTATIONS"]
          shard_index = int(os.environ["SHARD_INDEX"])
          shard_count = int(os.environ["SHARD_COUNT"])
          selected = [
              mutation[0]
              for index, mutation in enumerate(mutations)
              if index % shard_count == shard_index
          ]
          if not selected:
              raise SystemExit("formal mutation shard is empty")
          print("\n".join(selected))
          PY
          count="$(wc -l < "${RUNNER_TEMP}/formal-mutation-ids.txt" | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Shard 3 selected $count mutation(s)."
      - name: Formal certified guard mutation shard 3/4
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < "${RUNNER_TEMP}/formal-mutation-ids.txt"
          python -X utf8 tests/mutation_guards.py "${RUNNER_TEMP}/formal-mutations-3" "${ids[@]}" 2>&1 \
            | tee "${RUNNER_TEMP}/formal-mutations-3.log"
      - name: Record formal mutation shard digest
        id: digest
        shell: bash
        run: |
          echo "log_sha256=$(sha256sum "${RUNNER_TEMP}/formal-mutations-3.log" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload formal mutation shard evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-formal-mutations-3-${{ needs.classify.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/formal-mutation-ids.txt
            ${{ runner.temp }}/formal-mutations-3.log
          retention-days: 90

  trust_mutations:
    needs: classify
    if: needs.classify.outputs.mode == 'source'
    runs-on: ubuntu-latest
    outputs:
      result_sha256: ${{ steps.digest.outputs.result_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp,oracles]"
      - name: Trust-boundary mutation population
        run: >-
          python benchmarks/trust_hardening/audit/mutations.py
          --json "${RUNNER_TEMP}/trust-mutations.json"
      - name: Record trust mutation digest
        id: digest
        shell: bash
        run: |
          echo "result_sha256=$(sha256sum "${RUNNER_TEMP}/trust-mutations.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload trust mutation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-trust-mutations-${{ needs.classify.outputs.source_sha }}
          path: ${{ runner.temp }}/trust-mutations.json
          retention-days: 90

  certify:
    needs:
      - classify
      - fast311
      - fast312
      - scientific312
      - formal_mutations_0
      - formal_mutations_1
      - formal_mutations_2
      - formal_mutations_3
      - trust_mutations
    if: >-
      always() &&
      needs.classify.outputs.mode == 'source' &&
      needs.fast311.result == 'success' &&
      needs.fast312.result == 'success' &&
      needs.scientific312.result == 'success' &&
      needs.formal_mutations_0.result == 'success' &&
      needs.formal_mutations_1.result == 'success' &&
      needs.formal_mutations_2.result == 'success' &&
      needs.formal_mutations_3.result == 'success' &&
      needs.trust_mutations.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact measured source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp,oracles]"

      - name: Require a clean measured source tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Refusing to certify a dirty tree."
            git status --short
            exit 1
          fi

      - name: Build parallel assurance record
        env:
          SOURCE_SHA: ${{ needs.classify.outputs.source_sha }}
          PY311: ${{ needs.fast311.outputs.python_version }}
          PY312: ${{ needs.fast312.outputs.python_version }}
          PIP311_SHA: ${{ needs.fast311.outputs.pip_freeze_sha256 }}
          PIP312_SHA: ${{ needs.fast312.outputs.pip_freeze_sha256 }}
          NGSPICE: ${{ needs.scientific312.outputs.ngspice_version }}
          FORMAL_SHA_0: ${{ needs.formal_mutations_0.outputs.log_sha256 }}
          FORMAL_SHA_1: ${{ needs.formal_mutations_1.outputs.log_sha256 }}
          FORMAL_SHA_2: ${{ needs.formal_mutations_2.outputs.log_sha256 }}
          FORMAL_SHA_3: ${{ needs.formal_mutations_3.outputs.log_sha256 }}
          FORMAL_COUNT_0: ${{ needs.formal_mutations_0.outputs.count }}
          FORMAL_COUNT_1: ${{ needs.formal_mutations_1.outputs.count }}
          FORMAL_COUNT_2: ${{ needs.formal_mutations_2.outputs.count }}
          FORMAL_COUNT_3: ${{ needs.formal_mutations_3.outputs.count }}
          TRUST_SHA: ${{ needs.trust_mutations.outputs.result_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          import platform
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          source_sha = os.environ["SOURCE_SHA"]
          environment = {
              "schema": "forge.certification_environment/2",
              "source_commit": source_sha,
              "execution_model": "parallel_github_actions_jobs",
              "runner_os": os.environ.get("RUNNER_OS", ""),
              "certificate_builder_platform": platform.platform(),
              "python_3_11": os.environ["PY311"],
              "python_3_12": os.environ["PY312"],
              "ngspice": os.environ["NGSPICE"],
              "pip_freeze_3_11_sha256": os.environ["PIP311_SHA"],
              "pip_freeze_3_12_sha256": os.environ["PIP312_SHA"],
              "workflow": ".github/workflows/recertify-hardened-core.yml",
          }
          shard_counts = [
              int(os.environ[f"FORMAL_COUNT_{i}"])
              for i in range(4)
          ]
          if sum(shard_counts) != 79:
              raise SystemExit(
                  f"formal mutation shards cover {sum(shard_counts)} mutations, expected 79"
              )

          assurance = {
              "schema": "forge.core_hardening_assurance/2",
              "source_commit": source_sha,
              "execution_model": "parallel_gates_then_certificate",
              "functional": {
                  "fast_python_3_11": {"passed": True},
                  "fast_python_3_12": {"passed": True},
                  "scientific_python_3_12": {"passed": True},
                  "note": (
                      "Independent functional gates ran in parallel on the exact "
                      "source commit. The four certificate/freeze self-checks are "
                      "deferred only until the generated certificate child."
                  ),
              },
              "formal_guard_mutations": {
                  "passed": True,
                  "population": 79,
                  "shards": 4,
                  "shard_counts": {
                      str(i): int(os.environ[f"FORMAL_COUNT_{i}"])
                      for i in range(4)
                  },
                  "log_sha256_by_shard": {
                      str(i): os.environ[f"FORMAL_SHA_{i}"]
                      for i in range(4)
                  },
                  "claim": (
                      "Fresh execution of tests/mutation_guards.py on the exact "
                      "source commit, partitioned by stable MUTATIONS order modulo "
                      "four. Every shard reruns the unmutated control before its "
                      "assigned mutations."
                  ),
              },
              "trust_hardening_mutations": {
                  "passed": True,
                  "population": 13,
                  "survived": 0,
                  "invalid": 0,
                  "result_sha256": os.environ["TRUST_SHA"],
                  "claim": (
                      "Fresh trust-boundary mutation family on the exact source "
                      "commit in an independent parallel gate."
                  ),
              },
              "environment": environment,
              "policy": (
                  "Certificate generated only after every independent source gate "
                  "returned success for the same source SHA."
              ),
          }
          (temp / "core-hardening-assurance.json").write_text(
              json.dumps(assurance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Ensure measured source is still the pull-request head
        env:
          MEASURED_SHA: ${{ needs.classify.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_HEAD_REF}"
          remote_sha="$(git rev-parse "origin/${GITHUB_HEAD_REF}")"
          if [ "$remote_sha" != "$MEASURED_SHA" ]; then
            echo "Pull-request head moved while assurance was running."
            echo "Measured: $MEASURED_SHA"
            echo "Current:  $remote_sha"
            exit 1
          fi

      - name: Generate Core V2 certificate with official builder
        run: >-
          python -m tools.certification.core_certificate
          --build
          --assurance "${RUNNER_TEMP}/core-hardening-assurance.json"

      - name: Verify generated certificate against measured source bytes
        run: >-
          python -m tools.certification.core_certificate
          --verify
          --allow-dirty

      - name: Upload consolidated assurance record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hardened-core-assurance-${{ needs.classify.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/core-hardening-assurance.json
            certification/current_core_v2.json
          retention-days: 90

      - name: Commit certificate as child of the measured source commit
        env:
          MEASURED_SHA: ${{ needs.classify.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | grep -v '^ M certification/current_core_v2.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed during certification:"
            echo "$unexpected"
            exit 1
          fi
          if [ ! -s certification/current_core_v2.json ]; then
            echo "Certificate file is missing or empty."
            exit 1
          fi

          git fetch origin "${GITHUB_HEAD_REF}"
          remote_sha="$(git rev-parse "origin/${GITHUB_HEAD_REF}")"
          if [ "$remote_sha" != "$MEASURED_SHA" ]; then
            echo "Pull-request head moved after certificate generation; refusing push."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certification/current_core_v2.json
          git commit -m "certification: recertify hardened core"
          git push origin HEAD:"${GITHUB_HEAD_REF}"

  verify_certificate_child:
    needs: classify
    if: needs.classify.outputs.mode == 'certificate_child'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact certificate child
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.certificate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp,oracles]"
      - name: Verify stored certificate
        run: python -m tools.certification.core_certificate --verify
      - name: Run certificate/freeze self-checks
        run: >-
          python -m pytest -q
          tests/test_core_certificate.py::test_the_certificate_describes_this_tree
          tests/test_core_certificate.py::test_the_certificate_records_the_v1_relationship_truthfully
          tests/test_core_freeze_manifest.py::test_the_tree_is_core_freeze_v1
          tests/test_core_freeze_manifest.py::test_a_descendant_that_keeps_the_contract_still_verifies
