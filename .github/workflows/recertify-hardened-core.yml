          selected = [
              mutation[0]
              for index, mutation in enumerate(mutations)
              if index % shard_count == shard_index
          ]
          if not selected:
              raise SystemExit("formal mutation shard is empty")
          print("\n".join(selected))
          PY
          count="$(wc -l < "${RUNNER_TEMP}/formal-mutation-ids.txt" | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Shard 1 selected $count mutation(s)."
      - name: Formal certified guard mutation shard 1/4
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < "${RUNNER_TEMP}/formal-mutation-ids.txt"
          python -X utf8 tests/mutation_guards.py "${RUNNER_TEMP}/formal-mutations-1" "${ids[@]}" 2>&1 \
            | tee "${RUNNER_TEMP}/formal-mutations-1.log"
      - name: Record formal mutation shard digest
        id: digest
        shell: bash
        run: |
          echo "log_sha256=$(sha256sum "${RUNNER_TEMP}/formal-mutations-1.log" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload formal mutation shard evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-formal-mutations-1-${{ needs.classify.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/formal-mutation-ids.txt
            ${{ runner.temp }}/formal-mutations-1.log
          retention-days: 90

  formal_mutations_2:
    needs: classify
    if: needs.classify.outputs.mode == 'source'
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.select.outputs.count }}
      log_sha256: ${{ steps.digest.outputs.log_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp,oracles]"
      - name: Select formal mutation shard 2/4
        id: select
        env:
          SHARD_INDEX: "2"
          SHARD_COUNT: "4"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "${RUNNER_TEMP}/formal-mutation-ids.txt"
          import os
          import runpy

          namespace = runpy.run_path("tests/mutation_guards.py")
          mutations = namespace["MUTATIONS"]
          shard_index = int(os.environ["SHARD_INDEX"])
          shard_count = int(os.environ["SHARD_COUNT"])
          selected = [
              mutation[0]
              for index, mutation in enumerate(mutations)
              if index % shard_count == shard_index
          ]
          if not selected:
              raise SystemExit("formal mutation shard is empty")
          print("\n".join(selected))
          PY
          count="$(wc -l < "${RUNNER_TEMP}/formal-mutation-ids.txt" | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Shard 2 selected $count mutation(s)."
      - name: Formal certified guard mutation shard 2/4
        shell: bash
        run: |
