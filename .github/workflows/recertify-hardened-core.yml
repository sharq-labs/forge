      needs.v4_mutations_5.result == 'success' &&
      needs.v4_mutations_6.result == 'success' &&
      needs.v4_mutations_7.result == 'success' &&
      needs.trust_mutations.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      child_sha: ${{ steps.commit.outputs.child_sha }}
    env:
      SOURCE_SHA: ${{ needs.classify.outputs.source_sha }}
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout the exact measured source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp,oracles]"

      - name: Require a clean measured source tree
        run: python -m tools.certification.assert_clean_tree

      - name: Require the executed merge preview to carry the certified bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_SHA}"
          python -m tools.certification.hardening_assurance check-executed-scope \
            --executed "${GITHUB_SHA}" --source "${SOURCE_SHA}"

      - name: Download every source gate's evidence for this source commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: core-*-${{ needs.classify.outputs.source_sha }}
          path: ${{ runner.temp }}/evidence

      - name: Build assurance record from the downloaded evidence
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --source-commit "${SOURCE_SHA}"
            --evidence-dir "${RUNNER_TEMP}/evidence"
            --out "${RUNNER_TEMP}/core-hardening-assurance.json"
            --repository "${GITHUB_REPOSITORY}"
            --run-id "${GITHUB_RUN_ID}"
            --run-attempt "${GITHUB_RUN_ATTEMPT}"
            --executed-commit "${GITHUB_SHA}"
          )
          if [ -n "${PR_NUMBER:-}" ]; then
            args+=(--pull-request "${PR_NUMBER}")
          fi
          python -m tools.certification.hardening_assurance build "${args[@]}"

      - name: Ensure the selected branch still points at the measured source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          remote_sha="$(git rev-parse "origin/${TARGET_BRANCH}")"
          if [ "$remote_sha" != "$SOURCE_SHA" ]; then
            echo "Selected branch moved while assurance was running."
            echo "Measured: $SOURCE_SHA"
            echo "Current:  $remote_sha"
            exit 1
          fi

      - name: Generate Core V2 certificate with official builder
        run: >-
          python -m tools.certification.core_certificate
          --build
          --assurance "${RUNNER_TEMP}/core-hardening-assurance.json"

      - name: Verify generated certificate against measured source bytes
        run: >-
          python -m tools.certification.core_certificate
          --verify
          --allow-dirty

      - name: Commit certificate as child of the measured source commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain --untracked-files=all | grep -v '^ M certification/current_core_v2.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed during certification:"
            echo "$unexpected"
            exit 1
          fi
          if [ ! -s certification/current_core_v2.json ]; then
            echo "Certificate file is missing or empty."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certification/current_core_v2.json
          git commit -m "certification: recertify hardened core"
          echo "child_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the child's lineage before it is pushed
        run: python -m tools.certification.certificate_lineage verify-child

      - name: Stage the committed certificate as provenance evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/certificate-evidence"
          git show HEAD:certification/current_core_v2.json > "${RUNNER_TEMP}/certificate-evidence/current_core_v2.json"
          cp "${RUNNER_TEMP}/core-hardening-assurance.json" "${RUNNER_TEMP}/certificate-evidence/core-hardening-assurance.json"

      - name: Upload the certificate and its assurance record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hardened-core-assurance-${{ needs.classify.outputs.source_sha }}
          path: ${{ runner.temp }}/certificate-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Push the certificate child to the selected branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          remote_sha="$(git rev-parse "origin/${TARGET_BRANCH}")"
          if [ "$remote_sha" != "$SOURCE_SHA" ]; then
            echo "Selected branch moved after certificate generation; refusing push."
            exit 1
          fi
          git push origin HEAD:"${TARGET_BRANCH}"

  verify_certificate_child:
    needs:
      - classify
      - certify
    if: >-
      always() &&
      (needs.certify.result == 'success' ||
       needs.classify.outputs.mode == 'certificate_child')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact certificate child produced by this run
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.certify.outputs.child_sha || needs.classify.outputs.certificate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp,oracles]"
      - name: Verify lineage, scope, assurance evidence and control plane
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ needs.classify.outputs.source_sha }}"
          python -m tools.certification.certificate_lineage verify-child \
            --merge-preview "${{ needs.classify.outputs.source_sha }}"
      - name: Verify the parent's certify run produced these exact certificate bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m tools.certification.certificate_lineage verify-provenance
          --repository "${GITHUB_REPOSITORY}"
      - name: Verify stored certificate
        run: python -m tools.certification.core_certificate --verify
      - name: Run the deferred certificate/freeze self-checks; every one must pass
        shell: bash
        run: |
          set -euo pipefail
          nodes_text="$(python -m tools.certification.recertification_scope self-checks --format node-ids)"
          mapfile -t nodes <<< "$nodes_text"
          python -m pytest -q -p no:cacheprovider "${nodes[@]}" --junitxml "${RUNNER_TEMP}/self-checks.xml"
          python -m tools.certification.recertification_scope verify-junit "${RUNNER_TEMP}/self-checks.xml"
      - name: Prove the checks left the checkout byte-identical to the child
        run: python -m tools.certification.assert_clean_tree

  recertification_gate:
    name: recertification-gate
    needs:
      - classify
      - fast311
      - fast312
      - scientific312
      - campaign312
      - regression312
      - formal_mutations_0
      - formal_mutations_1
      - formal_mutations_2
      - formal_mutations_3
      - v4_mutations_0
      - v4_mutations_1
      - v4_mutations_2
      - v4_mutations_3
      - v4_mutations_4
      - v4_mutations_5
      - v4_mutations_6
      - v4_mutations_7
      - trust_mutations
      - certify
      - verify_certificate_child
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.certify.outputs.child_sha || needs.classify.outputs.certificate_sha || needs.classify.outputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Require every job this head's ownership mode depends on
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          python -m tools.certification.recertification_scope gate
          --workflow recertify --mode "${MODE:-unclassified}" --needs-json "$NEEDS"
