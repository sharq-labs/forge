  # The four formal shards are identical except for SHARD_INDEX. Membership is
  # not trusted from here: each shard's record is re-derived from its transcript
  # and the certify job proves the four cover the canonical population exactly.
  formal_mutations_0:
    needs: classify
    if: needs.classify.outputs.mode == 'source'
    runs-on: ubuntu-latest
    env:
      SHARD_INDEX: "0"
      SOURCE_SHA: ${{ needs.classify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp,oracles]"
      - name: Select formal mutation shard from the canonical population
        run: >-
          python -m tools.certification.mutation_population select
          --index "$SHARD_INDEX" --count 4
          --out "${RUNNER_TEMP}/formal-mutation-ids-${SHARD_INDEX}.txt"
      - name: Formal certified guard mutation shard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < "${RUNNER_TEMP}/formal-mutation-ids-${SHARD_INDEX}.txt"
          python -X utf8 tests/mutation_guards.py "${RUNNER_TEMP}/formal-mutations-${SHARD_INDEX}" "${ids[@]}" 2>&1 \
            | tee "${RUNNER_TEMP}/formal-mutations-${SHARD_INDEX}.log"
      - name: Record shard evidence from its transcript
        run: >-
          python -m tools.certification.mutation_population record
          --index "$SHARD_INDEX" --count 4
          --ids "${RUNNER_TEMP}/formal-mutation-ids-${SHARD_INDEX}.txt"
          --log "${RUNNER_TEMP}/formal-mutations-${SHARD_INDEX}.log"
          --source-commit "$SOURCE_SHA"
          --out "${RUNNER_TEMP}/formal-mutations-${SHARD_INDEX}.json"
      - name: Prove this gate left the checkout byte-identical to the source commit
        run: >-
          python -m tools.certification.assert_clean_tree
          --gate "formal_mutations_${SHARD_INDEX}"
          --record "${RUNNER_TEMP}/gate-formal_mutations_${SHARD_INDEX}.json"
      - name: Upload formal mutation shard evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-formal-mutations-${{ env.SHARD_INDEX }}-${{ needs.classify.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/formal-mutation-ids-${{ env.SHARD_INDEX }}.txt
            ${{ runner.temp }}/formal-mutations-${{ env.SHARD_INDEX }}.log
            ${{ runner.temp }}/formal-mutations-${{ env.SHARD_INDEX }}.json
            ${{ runner.temp }}/gate-formal_mutations_${{ env.SHARD_INDEX }}.json
          if-no-files-found: error
          retention-days: 90

