          --deselect tests/test_core_certificate.py::test_the_certificate_describes_this_tree
          --deselect tests/test_core_certificate.py::test_the_certificate_records_the_v1_relationship_truthfully
          --deselect tests/test_core_freeze_manifest.py::test_the_tree_is_core_freeze_v1
          --deselect tests/test_core_freeze_manifest.py::test_a_descendant_that_keeps_the_contract_still_verifies
      - name: Record Python 3.12 environment
        id: env
        shell: bash
        run: |
          set -euo pipefail
          python --version 2>&1 > "${RUNNER_TEMP}/python-3.12.txt"
          python -m pip freeze | LC_ALL=C sort > "${RUNNER_TEMP}/pip-freeze-3.12.txt"
          echo "python_version=$(cat "${RUNNER_TEMP}/python-3.12.txt")" >> "$GITHUB_OUTPUT"
          echo "pip_freeze_sha256=$(sha256sum "${RUNNER_TEMP}/pip-freeze-3.12.txt" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload Python 3.12 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-fast-312-${{ needs.classify.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/python-3.12.txt
            ${{ runner.temp }}/pip-freeze-3.12.txt
          retention-days: 90

  scientific312:
    needs: classify
    if: needs.classify.outputs.mode == 'source'
    runs-on: ubuntu-latest
    outputs:
      ngspice_version: ${{ steps.env.outputs.ngspice_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngspice
          python -m pip install -e ".[dev,mcp,oracles]"
      - name: Scientific functional gate — Python 3.12
        env:
          CRAFTY_NGSPICE_ARGV: ngspice
        run: >-
          python -m pytest -m "not campaign" -q -n 4 --dist loadfile
          --deselect tests/test_core_guards.py::test_every_dependency_the_tree_reaches_for_is_declared
          --deselect tests/test_heterogeneous_ngspice.py::test_a_the_provider_is_a_real_external_process
          --deselect tests/test_heterogeneous_ngspice.py::test_g2_a_genuine_non_zero_exit_is_a_provider_failure
          --deselect tests/test_heterogeneous_ngspice.py::test_j_relocating_the_provider_leaves_the_result_byte_identical
          --deselect benchmarks/model_measurement_validation/tests/test_model_measurement_validation.py::test_rebuilding_everything_reproduces_the_published_gates
          --deselect benchmarks/empirical_validation/tests/test_empirical_validation.py::test_rebuilding_everything_reproduces_the_published_gates
          --deselect tests/test_core_certificate.py::test_the_certificate_describes_this_tree
          --deselect tests/test_core_certificate.py::test_the_certificate_records_the_v1_relationship_truthfully
          --deselect tests/test_core_freeze_manifest.py::test_the_tree_is_core_freeze_v1
          --deselect tests/test_core_freeze_manifest.py::test_a_descendant_that_keeps_the_contract_still_verifies
      - name: Record scientific provider environment
        id: env
        shell: bash
        run: |
          set -euo pipefail
          ngspice --version 2>&1 | head -n 1 > "${RUNNER_TEMP}/ngspice-version.txt"
          echo "ngspice_version=$(cat "${RUNNER_TEMP}/ngspice-version.txt")" >> "$GITHUB_OUTPUT"
      - name: Upload scientific provider evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-scientific-${{ needs.classify.outputs.source_sha }}
          path: ${{ runner.temp }}/ngspice-version.txt
          retention-days: 90

  formal_mutations_0:
    needs: classify
    if: needs.classify.outputs.mode == 'source'
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.select.outputs.count }}
      log_sha256: ${{ steps.digest.outputs.log_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp,oracles]"
      - name: Select formal mutation shard 0/4
        id: select
        env:
          SHARD_INDEX: "0"
          SHARD_COUNT: "4"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "${RUNNER_TEMP}/formal-mutation-ids.txt"
          import os
          import runpy

          namespace = runpy.run_path("tests/mutation_guards.py")
          mutations = namespace["MUTATIONS"]
          shard_index = int(os.environ["SHARD_INDEX"])
          shard_count = int(os.environ["SHARD_COUNT"])
          selected = [
              mutation[0]
              for index, mutation in enumerate(mutations)
              if index % shard_count == shard_index
          ]
          if not selected:
              raise SystemExit("formal mutation shard is empty")
          print("\n".join(selected))
          PY
          count="$(wc -l < "${RUNNER_TEMP}/formal-mutation-ids.txt" | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Shard 0 selected $count mutation(s)."
      - name: Formal certified guard mutation shard 0/4
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < "${RUNNER_TEMP}/formal-mutation-ids.txt"
          python -X utf8 tests/mutation_guards.py "${RUNNER_TEMP}/formal-mutations-0" "${ids[@]}" 2>&1 \
            | tee "${RUNNER_TEMP}/formal-mutations-0.log"
      - name: Record formal mutation shard digest
        id: digest
        shell: bash
        run: |
          echo "log_sha256=$(sha256sum "${RUNNER_TEMP}/formal-mutations-0.log" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload formal mutation shard evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-formal-mutations-0-${{ needs.classify.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/formal-mutation-ids.txt
            ${{ runner.temp }}/formal-mutations-0.log
          retention-days: 90

  formal_mutations_1:
