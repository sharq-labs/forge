name: Recertify Hardened Core

on:
  pull_request:
    paths:
      - ".github/workflows/recertify-hardened-core.yml"
      - "src/engcore/scientific/**"
      - "src/engcore/execution/**"
      - "src/engcore/extensions.py"
      - "src/engcore/uq/cross_domain.py"
      - "tests/**"
      - "benchmarks/trust_hardening/**"

permissions:
  contents: write
  pull-requests: read

jobs:
  recertify:
    if: github.head_ref == 'core/hardening-integration-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@v4
        with:
          ref: core/hardening-integration-v1
          fetch-depth: 0

      - name: Decide whether this is already the certificate child
        id: gate
        shell: bash
        run: |
          subject="$(git log -1 --format=%s)"
          if [ "$subject" = "certification: recertify hardened core" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "certificate child commit detected; no recursive recertification"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scientific runtime and test dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngspice
          python -m pip install -e ".[dev,mcp,oracles]"

      # These four checks can only become green after the fresh certificate is
      # generated. Everything else in FAST remains load-bearing here.
      - name: FAST functional gate — Python 3.12
        if: steps.gate.outputs.run == 'true'
        run: >-
          python -m pytest -m "not expensive" -q -n 4 --dist loadfile
          --deselect tests/test_core_certificate.py::test_the_certificate_describes_this_tree
          --deselect tests/test_core_certificate.py::test_the_certificate_records_the_v1_relationship_truthfully
          --deselect tests/test_core_freeze_manifest.py::test_the_tree_is_core_freeze_v1
          --deselect tests/test_core_freeze_manifest.py::test_a_descendant_that_keeps_the_contract_still_verifies

      - name: Scientific functional gate — Python 3.12
        if: steps.gate.outputs.run == 'true'
        env:
          CRAFTY_NGSPICE_ARGV: ngspice
        run: >-
          python -m pytest -m "not campaign" -q -n 4 --dist loadfile
          --deselect tests/test_heterogeneous_ngspice.py::test_a_the_provider_is_a_real_external_process
          --deselect tests/test_heterogeneous_ngspice.py::test_g2_a_genuine_non_zero_exit_is_a_provider_failure
          --deselect tests/test_heterogeneous_ngspice.py::test_j_relocating_the_provider_leaves_the_result_byte_identical
          --deselect benchmarks/model_measurement_validation/tests/test_model_measurement_validation.py::test_rebuilding_everything_reproduces_the_published_gates
          --deselect benchmarks/empirical_validation/tests/test_empirical_validation.py::test_rebuilding_everything_reproduces_the_published_gates
          --deselect tests/test_core_certificate.py::test_the_certificate_describes_this_tree
          --deselect tests/test_core_certificate.py::test_the_certificate_records_the_v1_relationship_truthfully
          --deselect tests/test_core_freeze_manifest.py::test_the_tree_is_core_freeze_v1
          --deselect tests/test_core_freeze_manifest.py::test_a_descendant_that_keeps_the_contract_still_verifies

      - name: Formal certified guard mutation population
        if: steps.gate.outputs.run == 'true'
        run: python -X utf8 tests/mutation_guards.py "${RUNNER_TEMP}/formal-mutations"

      - name: New trust-boundary mutation population
        if: steps.gate.outputs.run == 'true'
        run: >-
          python benchmarks/trust_hardening/audit/mutations.py
          --json "${RUNNER_TEMP}/trust-mutations.json"

      - name: Set up Python 3.11
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python 3.11 test dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -e ".[dev,mcp,oracles]"

      - name: FAST functional gate — Python 3.11
        if: steps.gate.outputs.run == 'true'
        run: >-
          python -m pytest -m "not expensive" -q -n 4 --dist loadfile
          --deselect tests/test_core_certificate.py::test_the_certificate_describes_this_tree
          --deselect tests/test_core_certificate.py::test_the_certificate_records_the_v1_relationship_truthfully
          --deselect tests/test_core_freeze_manifest.py::test_the_tree_is_core_freeze_v1
          --deselect tests/test_core_freeze_manifest.py::test_a_descendant_that_keeps_the_contract_still_verifies

      - name: Require a clean source tree before certification
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Tests changed the checkout; refusing to certify a dirty tree."
            git status --short
            exit 1
          fi

      - name: Build fresh assurance record
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          cat > "${RUNNER_TEMP}/core-hardening-assurance.json" <<EOF
          {
            "schema": "forge.core_hardening_assurance/1",
            "source_commit": "${SOURCE_SHA}",
            "functional": {
              "fast_python_3_11": {"passed": true},
              "fast_python_3_12": {"passed": true},
              "scientific_python_3_12": {"passed": true},
              "note": "The four certificate/freeze self-checks were deferred until the generated certificate child commit; no other FAST checks were removed for recertification."
            },
            "formal_guard_mutations": {
              "passed": true,
              "population": 79,
              "claim": "Fresh execution of tests/mutation_guards.py on this source commit; this remains the formal historical mutation family."
            },
            "trust_hardening_mutations": {
              "passed": true,
              "population": 13,
              "survived": 0,
              "invalid": 0,
              "claim": "Separate fresh trust-boundary mutation family; intentionally not added to the formal 79 count."
            },
            "policy": "Certificate generated only after all gates above returned success in this workflow."
          }
          EOF

      - name: Restore Python 3.12 for deterministic certificate tooling
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Core V2 certificate with official builder
        if: steps.gate.outputs.run == 'true'
        run: >-
          python -m tools.certification.core_certificate
          --build
          --assurance "${RUNNER_TEMP}/core-hardening-assurance.json"

      - name: Verify generated certificate against source bytes
        if: steps.gate.outputs.run == 'true'
        run: >-
          python -m tools.certification.core_certificate
          --verify
          --allow-dirty

      - name: Commit certificate as child of the measured source commit
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          changed="$(git status --porcelain)"
          unexpected="$(git status --porcelain | grep -v '^ M certification/current_core_v2.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed during certification:"
            echo "$unexpected"
            exit 1
          fi
          if [ -z "$changed" ]; then
            echo "Certificate did not change; refusing an empty recertification commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certification/current_core_v2.json
          git commit -m "certification: recertify hardened core"
          git push origin HEAD:core/hardening-integration-v1
