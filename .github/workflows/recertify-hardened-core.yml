name: Recertify Hardened Core

on:
  pull_request:
    paths:
      - ".github/workflows/recertify-hardened-core.yml"
      - ".github/workflows/tests.yml"
      - "certification/current_core_v2.json"
      - "src/engcore/scientific/**"
      - "src/engcore/execution/**"
      - "src/engcore/extensions.py"
      - "src/engcore/uq/cross_domain.py"
      - "tests/**"
      - "benchmarks/trust_hardening/**"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: recertify-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      certificate_sha: ${{ steps.gate.outputs.certificate_sha }}
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Classify source commit versus certificate child
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          head_sha="$(git rev-parse HEAD)"

          if [ "$subject" = "certification: recertify hardened core" ]; then
            parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
            if [ "$parent_count" -ne 1 ]; then
              echo "A certificate child must have exactly one parent; found $parent_count."
              exit 1
            fi
            parent_sha="$(git rev-parse HEAD^)"
            mapfile -t changed < <(git diff --name-only "$parent_sha" HEAD)
            if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "certification/current_core_v2.json" ]; then
              echo "The recertification subject is reserved for a certificate-only child commit."
              printf 'Changed path: %s\n' "${changed[@]:-<none>}"
              exit 1
            fi
            echo "mode=certificate_child" >> "$GITHUB_OUTPUT"
            echo "source_sha=$parent_sha" >> "$GITHUB_OUTPUT"
            echo "certificate_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "Verified certificate-only child shape for source $parent_sha."
          else
            echo "mode=source" >> "$GITHUB_OUTPUT"
            echo "source_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "certificate_sha=" >> "$GITHUB_OUTPUT"
            echo "Source commit selected for parallel recertification: $head_sha"
          fi

  fast311:
    needs: classify
    if: needs.classify.outputs.mode == 'source'
    runs-on: ubuntu-latest
    outputs:
      python_version: ${{ steps.env.outputs.python_version }}
      pip_freeze_sha256: ${{ steps.env.outputs.pip_freeze_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,mcp,oracles]"
      - name: Dependency reachability guard — Python 3.11 (serial)
        run: >-
          python -m pytest
          tests/test_core_guards.py::test_every_dependency_the_tree_reaches_for_is_declared
          -q
      - name: FAST functional gate — Python 3.11
        run: >-
          python -m pytest -m "not expensive" -q -n 4 --dist loadfile
          --deselect tests/test_core_guards.py::test_every_dependency_the_tree_reaches_for_is_declared
          --deselect tests/test_core_certificate.py::test_the_certificate_describes_this_tree
          --deselect tests/test_core_certificate.py::test_the_certificate_records_the_v1_relationship_truthfully
          --deselect tests/test_core_freeze_manifest.py::test_the_tree_is_core_freeze_v1
          --deselect tests/test_core_freeze_manifest.py::test_a_descendant_that_keeps_the_contract_still_verifies
      - name: Record Python 3.11 environment
        id: env
        shell: bash
        run: |
          set -euo pipefail
          python --version 2>&1 > "${RUNNER_TEMP}/python-3.11.txt"
          python -m pip freeze | LC_ALL=C sort > "${RUNNER_TEMP}/pip-freeze-3.11.txt"
          echo "python_version=$(cat "${RUNNER_TEMP}/python-3.11.txt")" >> "$GITHUB_OUTPUT"
          echo "pip_freeze_sha256=$(sha256sum "${RUNNER_TEMP}/pip-freeze-3.11.txt" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload Python 3.11 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-fast-311-${{ needs.classify.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/python-3.11.txt
            ${{ runner.temp }}/pip-freeze-3.11.txt
          retention-days: 90

  fast312:
    needs: classify
    if: needs.classify.outputs.mode == 'source'
    runs-on: ubuntu-latest
    outputs:
      python_version: ${{ steps.env.outputs.python_version }}
      pip_freeze_sha256: ${{ steps.env.outputs.pip_freeze_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp,oracles]"
      - name: Dependency reachability guard — Python 3.12 (serial)
        run: >-
