name: Recertify Hardened Core

# Ownership is derived from tools/certification/recertification_scope.py.
# Pull requests always enter this workflow; ordinary changes skip the expensive
# source gates, while certified/trust-sensitive changes are fully recertified.
# Manual dispatch remains available for an explicit branch recertification.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: recertify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.recertification }}
      source_sha: ${{ steps.classify.outputs.source_sha }}
      certificate_sha: ${{ steps.classify.outputs.certificate_sha }}
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Classify assurance ownership
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            python -m tools.certification.recertification_scope classify \
              --event pull_request --base "$BASE_SHA" --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            echo "mode=recertify_source" >> "$GITHUB_OUTPUT"
            echo "recertification=source" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "certificate_sha=" >> "$GITHUB_OUTPUT"
          fi

  fast311:
    needs: classify
    if: needs.classify.outputs.mode == 'source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,mcp,oracles]"
      - name: Dependency reachability guard — Python 3.11 (serial)
        run: >-
          python -m pytest
          tests/test_core_guards.py::test_every_dependency_the_tree_reaches_for_is_declared
          -q --junitxml "${RUNNER_TEMP}/junit-dependency-guard-3.11.xml"
      - name: FAST functional gate — Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          deferred_text="$(python -m tools.certification.recertification_scope self-checks --format deselect)"
          mapfile -t deferred <<< "$deferred_text"
          python -m pytest -m "not expensive" -q -n 4 --dist loadfile \
            --deselect tests/test_core_guards.py::test_every_dependency_the_tree_reaches_for_is_declared \
            "${deferred[@]}" \
            --junitxml "${RUNNER_TEMP}/junit-fast-3.11.xml"
      - name: Record Python 3.11 environment
        shell: bash
        run: |
          set -euo pipefail
          python --version > "${RUNNER_TEMP}/python-3.11.txt" 2>&1
          python -m pip freeze | LC_ALL=C sort > "${RUNNER_TEMP}/pip-freeze-3.11.txt"
      - name: Prove this gate left the checkout byte-identical to the source commit
        run: >-
          python -m tools.certification.assert_clean_tree
          --gate fast311 --record "${RUNNER_TEMP}/gate-fast311.json"
      - name: Upload Python 3.11 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-fast-311-${{ needs.classify.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/python-3.11.txt
            ${{ runner.temp }}/pip-freeze-3.11.txt
            ${{ runner.temp }}/junit-dependency-guard-3.11.xml
            ${{ runner.temp }}/junit-fast-3.11.xml
            ${{ runner.temp }}/gate-fast311.json
          if-no-files-found: error
          retention-days: 90

