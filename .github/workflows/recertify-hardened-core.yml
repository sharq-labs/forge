          python-version: "3.12"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngspice
          python -m pip install -e ".[dev,mcp,oracles]"
      - name: Scientific functional gate — Python 3.12
        env:
          CRAFTY_NGSPICE_ARGV: ngspice
        shell: bash
        run: |
          set -euo pipefail
          deferred_text="$(python -m tools.certification.recertification_scope self-checks --format deselect)"
          mapfile -t deferred <<< "$deferred_text"
          python -m pytest -m "not campaign" -q -n 4 --dist loadfile \
            --deselect tests/test_core_guards.py::test_every_dependency_the_tree_reaches_for_is_declared \
            --deselect tests/test_heterogeneous_ngspice.py::test_a_the_provider_is_a_real_external_process \
            --deselect tests/test_heterogeneous_ngspice.py::test_g2_a_genuine_non_zero_exit_is_a_provider_failure \
            --deselect tests/test_heterogeneous_ngspice.py::test_j_relocating_the_provider_leaves_the_result_byte_identical \
            --deselect benchmarks/model_measurement_validation/tests/test_model_measurement_validation.py::test_rebuilding_everything_reproduces_the_published_gates \
            --deselect benchmarks/empirical_validation/tests/test_empirical_validation.py::test_rebuilding_everything_reproduces_the_published_gates \
            "${deferred[@]}" \
            --junitxml "${RUNNER_TEMP}/junit-scientific-3.12.xml"
      - name: Record scientific provider environment
        shell: bash
        run: |
          set -euo pipefail
          python --version > "${RUNNER_TEMP}/python-scientific-3.12.txt" 2>&1
          python -m pip freeze | LC_ALL=C sort > "${RUNNER_TEMP}/pip-freeze-scientific-3.12.txt"
          ngspice --version > "${RUNNER_TEMP}/ngspice-version.txt" 2>&1
      - name: Prove this gate left the checkout byte-identical to the source commit
        run: >-
          python -m tools.certification.assert_clean_tree
          --gate scientific312 --record "${RUNNER_TEMP}/gate-scientific312.json"
      - name: Upload scientific evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-scientific-${{ needs.classify.outputs.source_sha }}
