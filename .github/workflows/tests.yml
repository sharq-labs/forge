name: Tests

# Ordinary PRs run the normal test suite here.
# Core-changing PRs delegate FAST / scientific / mutation assurance to the
# hardened-core workflow, which runs those independent gates in parallel and
# produces a certificate-only child commit. Main pushes still run the full suite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      delegate_to_recertify: ${{ steps.scope.outputs.delegate_to_recertify }}
      certificate_child: ${{ steps.scope.outputs.certificate_child }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify workflow ownership
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          delegate=false
          certificate_child=false

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            head_sha="${{ github.event.pull_request.head.sha }}"
            base_sha="${{ github.event.pull_request.base.sha }}"
            subject="$(git log -1 --format=%s "$head_sha")"

            if [ "$subject" = "certification: recertify hardened core" ]; then
              parent_count="$(git rev-list --parents -n 1 "$head_sha" | awk '{print NF-1}')"
              if [ "$parent_count" -ne 1 ]; then
                echo "A certificate child must have exactly one parent; found $parent_count."
                exit 1
              fi
              parent_sha="$(git rev-parse "$head_sha^")"
              mapfile -t changed < <(git diff --name-only "$parent_sha" "$head_sha")
              if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "certification/current_core_v2.json" ]; then
                echo "Reserved recertification subject used by a non-certificate-only commit."
                printf 'Changed path: %s\n' "${changed[@]:-<none>}"
                exit 1
              fi
              certificate_child=true
              echo "Certificate-only child: heavy source assurance is not repeated."
            else
              while IFS= read -r path; do
                case "$path" in
                  .github/workflows/recertify-hardened-core.yml|.github/workflows/tests.yml|certification/current_core_v2.json|src/engcore/scientific/*|src/engcore/execution/*|src/engcore/extensions.py|src/engcore/uq/cross_domain.py|tests/*|benchmarks/trust_hardening/*)
                    delegate=true
                    break
                    ;;
                esac
              done < <(git diff --name-only "$base_sha" "$head_sha")

              if [ "$delegate" = "true" ]; then
                echo "Core-assurance PR: FAST/scientific/mutations are delegated to Recertify Hardened Core."
              else
                echo "Ordinary PR: normal Tests workflow owns the test suite."
              fi
            fi
          else
            echo "Non-PR run: normal Tests workflow owns the full suite."
          fi

          echo "delegate_to_recertify=$delegate" >> "$GITHUB_OUTPUT"
          echo "certificate_child=$certificate_child" >> "$GITHUB_OUTPUT"

  repo-layout:
    name: repository layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enforce documentation layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root_markdown = sorted(path.name for path in Path('.').glob('*.md'))
          allowed_root = {'README.md'}
          unexpected_root = [name for name in root_markdown if name not in allowed_root]
          source_markdown = sorted(str(path) for path in Path('src').rglob('*.md'))

          problems = []
          if unexpected_root:
              problems.append(
                  'long-form Markdown belongs under docs/; unexpected root files: '
                  + ', '.join(unexpected_root)
              )
          if source_markdown:
              problems.append(
                  'src/ is code/docstrings only; move Markdown documentation out of src/: '
                  + ', '.join(source_markdown)
              )

          if problems:
              raise SystemExit('\n'.join(problems))

          print('documentation layout OK: root entry point is README.md and src/ has no Markdown')
          PY

  fast:
    needs: scope
    if: needs.scope.outputs.delegate_to_recertify != 'true' && needs.scope.outputs.certificate_child != 'true'
    name: fast (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,mcp,oracles]"
      - name: Dependency reachability guard (serial)
        run: >-
          python -m pytest
          tests/test_core_guards.py::test_every_dependency_the_tree_reaches_for_is_declared
          -q
      - name: FAST suite
        run: >-
          python -m pytest -m "not expensive" -q -n 4 --dist loadfile
          --deselect tests/test_core_guards.py::test_every_dependency_the_tree_reaches_for_is_declared

  mutations:
    needs: scope
    if: needs.scope.outputs.delegate_to_recertify != 'true' && needs.scope.outputs.certificate_child != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp,oracles]"
      - run: python -X utf8 tests/mutation_guards.py "${RUNNER_TEMP}/mutations"

  scientific:
    needs: scope
    if: needs.scope.outputs.delegate_to_recertify != 'true' && needs.scope.outputs.certificate_child != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq ngspice
      - run: pip install -e ".[dev,mcp,oracles]"
      - name: Scientific suite
        env:
          CRAFTY_NGSPICE_ARGV: ngspice
        run: >-
          python -m pytest -m "not campaign" -q -n 4 --dist loadfile
          --deselect tests/test_core_guards.py::test_every_dependency_the_tree_reaches_for_is_declared
          --deselect tests/test_heterogeneous_ngspice.py::test_a_the_provider_is_a_real_external_process
          --deselect tests/test_heterogeneous_ngspice.py::test_g2_a_genuine_non_zero_exit_is_a_provider_failure
          --deselect tests/test_heterogeneous_ngspice.py::test_j_relocating_the_provider_leaves_the_result_byte_identical
          --deselect benchmarks/model_measurement_validation/tests/test_model_measurement_validation.py::test_rebuilding_everything_reproduces_the_published_gates
          --deselect benchmarks/empirical_validation/tests/test_empirical_validation.py::test_rebuilding_everything_reproduces_the_published_gates

  certificate-child:
    needs: scope
    if: needs.scope.outputs.certificate_child == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp,oracles]"
      - name: Verify certificate child without repeating source assurance
        run: |
          python -m tools.certification.core_certificate --verify
          python -m pytest -q \
            tests/test_core_certificate.py::test_the_certificate_describes_this_tree \
            tests/test_core_certificate.py::test_the_certificate_records_the_v1_relationship_truthfully \
            tests/test_core_freeze_manifest.py::test_the_tree_is_core_freeze_v1 \
            tests/test_core_freeze_manifest.py::test_a_descendant_that_keeps_the_contract_still_verifies

  reproduce:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t crafty-repro .
      - run: docker run --rm crafty-repro

  benchmark:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: split is reproducible from the seed and the rule
        run: |
          python benchmarks/hard/split_hard.py --cases benchmarks/hard/cases_hard \
            --out /tmp/split_check.json
          python - <<'EOF'
          import json
          a = json.load(open("benchmarks/hard/split_hard.json"))
          b = json.load(open("/tmp/split_check.json"))
          for k in ("rule_id", "seed", "case_set_digest", "dev_digest", "holdout_digest"):
              assert a[k] == b[k], (k, a[k], b[k])
          print("split reproduced:", a["n_dev"], "dev +", a["n_holdout"], "hold-out")
          EOF
      - name: the seal refuses the full set without --open-holdout
        run: |
          if python benchmarks/hard/score_hard.py --src src \
               --cases benchmarks/hard/cases_hard --workers 4 --split all; then
            echo "SEAL BROKEN: --split all succeeded without --open-holdout"; exit 1
          fi
      - name: the committed benchmark records still reproduce
        run: python -m pytest tests/test_benchmark_records.py -q
