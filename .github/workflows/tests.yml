name: Tests

# One job, one Python, the same command a developer runs locally.
# FAST tier on every push and PR; SCIENTIFIC tier on main pushes.
# The FULL tier (campaign tests, ~10 min) is run manually before a freeze.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `.[dev,mcp]`, not `.[dev]`: without the MCP group the boundary tests
      # skip, and a skipped test proves nothing. The guard in
      # tests/mcp/test_battery_boundary.py is the safety net for a bare
      # install; CI is not a bare install and should exercise the transport.
      - run: pip install -e ".[dev,mcp]"
      # -n 4, not -n auto: the worker count must not track whatever hardware
      # the runner happens to have. Memory grows ~200 MB per worker, so a
      # larger runner silently scales into the exhaustion documented in
      # docs/TESTING.md ("`-n auto` is not safe here"). --dist loadfile keeps
      # each memoizing module on one worker; see the same document.
      - run: python -m pytest -m "not expensive" -q -n 4 --dist loadfile

  # A check that depends on being remembered is a check that will be forgotten.
  # That is the argument tests/mutation_guards.py itself makes about adapters --
  # an admission layer nobody is forced through is one somebody routes around --
  # and it applies hardest to the harness. It ran once, by hand, in the round
  # that wrote it, and it is the only thing in this repository that can tell a
  # guard from a sentence about a guard. This job is what makes it run again.
  #
  # It copies src/, tests/ and pyproject.toml into a throwaway tree, removes one
  # guard from the copy as if it had never been written, and runs
  # tests/test_core_guards.py against it -- sixteen times, once per guard. Every
  # mutation must turn that suite red. The harness exits non-zero if any does
  # not, and a GREEN names a guard that is decoration. Nothing in the workspace
  # is written; the mutant trees go under RUNNER_TEMP.
  #
  # No `if: github.event_name != 'pull_request'`, unlike the three jobs below.
  # A guard stops guarding in a pull request, not in a push to main, so the pull
  # request is the only place this can still be acted on before it is history.
  # It costs about ninety seconds.
  mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `.[dev,mcp]`, not `.[dev]`: the whole of tests/ is copied into each
      # mutant tree and collected there, so the same reasoning as the FAST job
      # applies -- a skipped test proves nothing about the guard it covers.
      - run: pip install -e ".[dev,mcp]"
      # No ngspice. The one guard test that reaches a provider drives
      # tests/nonfinite_provider.py through sys.executable, by design: the
      # thing under test is the admission layer, not the simulator.
      - run: python -X utf8 tests/mutation_guards.py "${RUNNER_TEMP}/mutations"

  scientific:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq ngspice
      # `.[dev,mcp]`, not `.[dev]`: without the MCP group the boundary tests
      # skip, and a skipped test proves nothing. The guard in
      # tests/mcp/test_battery_boundary.py is the safety net for a bare
      # install; CI is not a bare install and should exercise the transport.
      - run: pip install -e ".[dev,mcp]"
      # The provider default is `wsl.exe -e ngspice` (the author's Windows
      # host). On Linux point it at the native binary. Three tests assert the
      # default WSL invocation itself and are Windows-only; they are deselected
      # here, not skipped in the suite.
      - env:
          # Name is read by NgspiceInvocation.from_environment in
          # src/engcore/domains/electrical/ngspice.py; renaming it means
          # changing that read and tests/test_heterogeneous_ngspice.py::
          # test_j2_the_invocation_is_configuration_and_reads_the_environment
          # in the same commit, or CI silently falls back to the WSL default
          # and every provider test fails on Linux.
          CRAFTY_NGSPICE_ARGV: ngspice
        run: >
          python -m pytest -m "not campaign" -q -n 4 --dist loadfile
          --deselect tests/test_heterogeneous_ngspice.py::test_a_the_provider_is_a_real_external_process
          --deselect tests/test_heterogeneous_ngspice.py::test_g2_a_genuine_non_zero_exit_is_a_provider_failure
          --deselect tests/test_heterogeneous_ngspice.py::test_j_relocating_the_provider_leaves_the_result_byte_identical

  # Does this run anywhere but the author's laptop? The two jobs above answer
  # "on a GitHub runner with a hand-written apt line". This one answers it from
  # a bare image with no host state at all, using the same Dockerfile a buyer
  # would run. See docs/reproduce.md.
  #
  # This job failed at the FAST tier for one round, because
  # src/engcore/mcp/server.py imports `mcp` and pyproject.toml did not declare
  # it. The `[mcp]` group and the import guard close that, so
  # `continue-on-error` is gone and this job is now load-bearing: it is the
  # thing that would catch the next undeclared dependency on the day it lands.
  # NEEDS.md, evidence round, B.1.
  reproduce:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crafty-repro .
      - run: docker run --rm crafty-repro

  # The benchmark is scored on the DEVELOPMENT split only. The 600-case
  # hold-out stays sealed; score_hard.py exits non-zero if this job ever tries
  # to score it without --open-holdout, which is the enforcement working rather
  # than a CI failure. benchmarks/hard/README.md, "The hold-out split".
  benchmark:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: split is reproducible from the seed and the rule
        run: |
          python benchmarks/hard/split_hard.py --cases benchmarks/hard/cases_hard \
            --out /tmp/split_check.json
          python - <<'EOF'
          import json
          a = json.load(open("benchmarks/hard/split_hard.json"))
          b = json.load(open("/tmp/split_check.json"))
          for k in ("rule_id", "seed", "case_set_digest", "dev_digest", "holdout_digest"):
              assert a[k] == b[k], (k, a[k], b[k])
          print("split reproduced:", a["n_dev"], "dev +", a["n_holdout"], "hold-out")
          EOF
      - name: the seal refuses the full set without --open-holdout
        run: |
          if python benchmarks/hard/score_hard.py --src src \
               --cases benchmarks/hard/cases_hard --workers 4 --split all; then
            echo "SEAL BROKEN: --split all succeeded without --open-holdout"; exit 1
          fi
      # Both case sets were scored here into /tmp and the answer thrown away.
      # Nothing compared either committed record against the re-score, and the
      # battery one had already gone stale -- it records 400/400 and the tree
      # produces 372/400 -- without anything going red. This step re-scores
      # both through the same scorer and FAILS on disagreement, which is the
      # whole difference between running a benchmark and checking one.
      #
      # It follows the shape of the "split is reproducible" step above:
      # recompute, compare the declared fields, refuse to continue if they
      # moved. The comparison lives in the test so it runs locally too;
      # this step is what makes it run here.
      - name: the committed benchmark records still reproduce
        run: python -m pytest tests/test_benchmark_records.py -q
