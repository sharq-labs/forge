name: Tests

# Every pull request is classified by the repository's single assurance
# ownership policy. Ordinary changes run the normal suite here; certified or
# trust-sensitive changes are delegated to the recertification workflow.
# Pushes to main run the full ordinary suite again against the merged bytes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      delegate_to_recertify: ${{ steps.scope.outputs.delegate_to_recertify }}
      certificate_child: ${{ steps.scope.outputs.certificate_child }}
      heavy_runs_on: ${{ steps.runner.outputs.heavy_runs_on }}
      heavy_runner_mode: ${{ steps.runner.outputs.heavy_runner_mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Classify workflow ownership
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            python -m tools.certification.recertification_scope classify \
              --event "$EVENT" --base "$BASE_SHA" --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            python -m tools.certification.recertification_scope classify \
              --event "$EVENT" --github-output "$GITHUB_OUTPUT"
          fi
      - name: Select where the heavy jobs run
        id: runner
        env:
          FORGE_HEAVY_RUNNER: ${{ vars.FORGE_HEAVY_RUNNER }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: python -m tools.ci.select_heavy_runner --check-online

  repo-layout:
    name: repository layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enforce documentation layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root_markdown = sorted(path.name for path in Path('.').glob('*.md'))
          allowed_root = {'README.md', 'CLAUDE.md'}
          unexpected_root = [name for name in root_markdown if name not in allowed_root]
          source_markdown = sorted(str(path) for path in Path('src').rglob('*.md'))

          problems = []
          if unexpected_root:
              problems.append(
                  'long-form Markdown belongs under docs/; unexpected root files: '
                  + ', '.join(unexpected_root)
              )
          if source_markdown:
              problems.append(
                  'src/ is code/docstrings only; move Markdown documentation out of src/: '
                  + ', '.join(source_markdown)
              )

          if problems:
              raise SystemExit('\n'.join(problems))

          print('documentation layout OK: root contains README.md/CLAUDE.md only and src/ has no Markdown')
          PY

  fast:
    needs: scope
    if: needs.scope.outputs.mode == 'ordinary' || needs.scope.outputs.mode == 'full_suite'
    name: fast (py ${{ matrix.python-version }})
    runs-on: ${{ fromJSON(needs.scope.outputs.heavy_runs_on) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pin the environment and record the runner
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::the checkout is $(git rev-parse HEAD), not the commit under test $EXPECTED_SHA"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::the checkout is not clean before any gate ran"
            exit 1
          fi
          # A self-hosted runner keeps its Python across jobs, so every job installs into its own
          # virtualenv: nothing a previous job installed can satisfy this job's imports.
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            python -m venv "${RUNNER_TEMP}/job-venv"
            echo "${RUNNER_TEMP}/job-venv/bin" >> "$GITHUB_PATH"
            echo "VIRTUAL_ENV=${RUNNER_TEMP}/job-venv" >> "$GITHUB_ENV"
          fi
          {
            echo "commit=$EXPECTED_SHA"
            echo "workflow=${GITHUB_WORKFLOW} job=${GITHUB_JOB} run=${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo "runner=${RUNNER_NAME} environment=${RUNNER_ENVIRONMENT} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
            echo "kernel=$(uname -srm)"
            echo "os_release=$(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "cpus=$(nproc)"
            echo "memory=$(free -m | awk '/^Mem:/ {print $2 " MB"}')"
            echo "python=$(python --version 2>&1)"
            echo "git=$(git --version)"
            echo "docker=$(docker --version 2>/dev/null || echo absent)"
            echo "ngspice=$(ngspice --version 2>&1 | sed -n 2p || true)"
          } > "${RUNNER_TEMP}/runner-identity.txt"
          cat "${RUNNER_TEMP}/runner-identity.txt"
      - run: pip install -e ".[dev,mcp,oracles]"
      - name: Dependency reachability guard (serial)
        run: >-
          python -m pytest
          tests/test_core_guards.py::test_every_dependency_the_tree_reaches_for_is_declared
          -q
      - name: FAST suite
        run: >-
          python -m pytest -m "not expensive" -q -n 4 --dist loadfile
          --deselect tests/test_core_guards.py::test_every_dependency_the_tree_reaches_for_is_declared
      - name: Prove the suite left the checkout byte-identical
        run: python -m tools.certification.assert_clean_tree
      - name: Upload runner identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-identity-${{ github.job }}-${{ matrix.python-version }}-${{ github.sha }}
          path: ${{ runner.temp }}/runner-identity.txt
          if-no-files-found: warn
          overwrite: true
          retention-days: 90

  mutations:
    needs: scope
    if: needs.scope.outputs.mode == 'ordinary' || needs.scope.outputs.mode == 'full_suite'
    runs-on: ${{ fromJSON(needs.scope.outputs.heavy_runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Pin the environment and record the runner
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::the checkout is $(git rev-parse HEAD), not the commit under test $EXPECTED_SHA"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::the checkout is not clean before any gate ran"
            exit 1
          fi
          # A self-hosted runner keeps its Python across jobs, so every job installs into its own
          # virtualenv: nothing a previous job installed can satisfy this job's imports.
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            python -m venv "${RUNNER_TEMP}/job-venv"
            echo "${RUNNER_TEMP}/job-venv/bin" >> "$GITHUB_PATH"
            echo "VIRTUAL_ENV=${RUNNER_TEMP}/job-venv" >> "$GITHUB_ENV"
          fi
          {
            echo "commit=$EXPECTED_SHA"
            echo "workflow=${GITHUB_WORKFLOW} job=${GITHUB_JOB} run=${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo "runner=${RUNNER_NAME} environment=${RUNNER_ENVIRONMENT} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
            echo "kernel=$(uname -srm)"
            echo "os_release=$(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "cpus=$(nproc)"
            echo "memory=$(free -m | awk '/^Mem:/ {print $2 " MB"}')"
            echo "python=$(python --version 2>&1)"
            echo "git=$(git --version)"
            echo "docker=$(docker --version 2>/dev/null || echo absent)"
            echo "ngspice=$(ngspice --version 2>&1 | sed -n 2p || true)"
          } > "${RUNNER_TEMP}/runner-identity.txt"
          cat "${RUNNER_TEMP}/runner-identity.txt"
      - run: pip install -e ".[dev,mcp,oracles]"
      - run: python -X utf8 tests/mutation_guards.py "${RUNNER_TEMP}/mutations"
      - name: Prove the harness left the checkout byte-identical
        run: python -m tools.certification.assert_clean_tree
      - name: Upload runner identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-identity-${{ github.job }}-${{ github.sha }}
          path: ${{ runner.temp }}/runner-identity.txt
          if-no-files-found: warn
          overwrite: true
          retention-days: 90

  scientific:
    needs: scope
    if: needs.scope.outputs.mode == 'ordinary' || needs.scope.outputs.mode == 'full_suite'
    runs-on: ${{ fromJSON(needs.scope.outputs.heavy_runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Pin the environment and record the runner
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::the checkout is $(git rev-parse HEAD), not the commit under test $EXPECTED_SHA"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::the checkout is not clean before any gate ran"
            exit 1
          fi
          # A self-hosted runner keeps its Python across jobs, so every job installs into its own
          # virtualenv: nothing a previous job installed can satisfy this job's imports.
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            python -m venv "${RUNNER_TEMP}/job-venv"
            echo "${RUNNER_TEMP}/job-venv/bin" >> "$GITHUB_PATH"
            echo "VIRTUAL_ENV=${RUNNER_TEMP}/job-venv" >> "$GITHUB_ENV"
          fi
          {
            echo "commit=$EXPECTED_SHA"
            echo "workflow=${GITHUB_WORKFLOW} job=${GITHUB_JOB} run=${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo "runner=${RUNNER_NAME} environment=${RUNNER_ENVIRONMENT} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
            echo "kernel=$(uname -srm)"
            echo "os_release=$(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "cpus=$(nproc)"
            echo "memory=$(free -m | awk '/^Mem:/ {print $2 " MB"}')"
            echo "python=$(python --version 2>&1)"
            echo "git=$(git --version)"
            echo "docker=$(docker --version 2>/dev/null || echo absent)"
            echo "ngspice=$(ngspice --version 2>&1 | sed -n 2p || true)"
          } > "${RUNNER_TEMP}/runner-identity.txt"
          cat "${RUNNER_TEMP}/runner-identity.txt"
      - name: Provider and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            sudo apt-get install -y -qq ngspice
          fi
          command -v ngspice >/dev/null || { echo "::error::ngspice is not installed on this runner"; exit 1; }
          pip install -e ".[dev,mcp,oracles]"
      - name: Scientific suite
        env:
          CRAFTY_NGSPICE_ARGV: ngspice
        run: >-
          python -m pytest -m "not campaign" -q -n 4 --dist loadfile
          --deselect tests/test_core_guards.py::test_every_dependency_the_tree_reaches_for_is_declared
          --deselect tests/test_heterogeneous_ngspice.py::test_a_the_provider_is_a_real_external_process
          --deselect tests/test_heterogeneous_ngspice.py::test_g2_a_genuine_non_zero_exit_is_a_provider_failure
          --deselect tests/test_heterogeneous_ngspice.py::test_j_relocating_the_provider_leaves_the_result_byte_identical
          --deselect benchmarks/model_measurement_validation/tests/test_model_measurement_validation.py::test_rebuilding_everything_reproduces_the_published_gates
          --deselect benchmarks/empirical_validation/tests/test_empirical_validation.py::test_rebuilding_everything_reproduces_the_published_gates
      - name: Prove the suite left the checkout byte-identical
        run: python -m tools.certification.assert_clean_tree
      - name: Upload runner identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-identity-${{ github.job }}-${{ github.sha }}
          path: ${{ runner.temp }}/runner-identity.txt
          if-no-files-found: warn
          overwrite: true
          retention-days: 90

  certificate-child:
    needs: scope
    if: needs.scope.outputs.mode == 'certificate_child'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp,oracles]"
      - name: Verify lineage, scope, assurance evidence and control plane
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_SHA}"
          python -m tools.certification.certificate_lineage verify-child --merge-preview "${GITHUB_SHA}"
      - name: Verify stored certificate
        run: python -m tools.certification.core_certificate --verify
      - name: Run the deferred certificate/freeze self-checks; every one must pass
        shell: bash
        run: |
          set -euo pipefail
          nodes_text="$(python -m tools.certification.recertification_scope self-checks --format node-ids)"
          mapfile -t nodes <<< "$nodes_text"
          python -m pytest -q -p no:cacheprovider "${nodes[@]}" --junitxml "${RUNNER_TEMP}/self-checks.xml"
          python -m tools.certification.recertification_scope verify-junit "${RUNNER_TEMP}/self-checks.xml"
      - name: Prove the checks left the checkout byte-identical to the child
        run: python -m tools.certification.assert_clean_tree

  tests-gate:
    name: tests-gate
    needs:
      - scope
      - repo-layout
      - fast
      - mutations
      - scientific
      - certificate-child
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Require every job this change's ownership mode depends on
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          python -m tools.certification.recertification_scope gate
          --workflow tests --mode "${MODE:-unclassified}" --event "$EVENT"
          --needs-json "$NEEDS"


  reproduce:
    needs: scope
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(needs.scope.outputs.heavy_runs_on) }}
    permissions:
      contents: read
    env:
      IMAGE: crafty-repro-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert the checkout is the commit under test and clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
      # This job's claim is "it reproduces from a bare machine", so nothing is reused: --no-cache rebuilds
      # every layer (a cached dependency layer would hide upstream drift a fresh VM exposes) and --pull
      # refreshes the pinned base tag. The image is labelled with the exact commit and removed afterwards.
      - name: Build the reproducibility image
        run: >-
          docker build --pull --no-cache --label "org.forge.commit=${GITHUB_SHA}" -t "${IMAGE}" .
      - name: Run it
        shell: bash
        run: |
          set -euo pipefail
          limits=""
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            limits="--cpus=8 --memory=12g --pids-limit=8192"
          fi
          docker run --rm ${limits} "${IMAGE}"
      - name: Record the runner and remove this run's image
        if: always()
        shell: bash
        run: |
          {
            echo "commit=${GITHUB_SHA} run=${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo "runner=${RUNNER_NAME} environment=${RUNNER_ENVIRONMENT} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
            echo "docker=$(docker --version 2>&1)"
          } | tee "${RUNNER_TEMP}/runner-identity.txt"
          docker image rm -f "${IMAGE}" || true
      - name: Upload runner identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-identity-${{ github.job }}-${{ github.sha }}
          path: ${{ runner.temp }}/runner-identity.txt
          if-no-files-found: warn
          overwrite: true
          retention-days: 90

  benchmark:
    needs: scope
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(needs.scope.outputs.heavy_runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Pin the environment and record the runner
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::the checkout is $(git rev-parse HEAD), not the commit under test $EXPECTED_SHA"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::the checkout is not clean before any gate ran"
            exit 1
          fi
          # A self-hosted runner keeps its Python across jobs, so every job installs into its own
          # virtualenv: nothing a previous job installed can satisfy this job's imports.
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            python -m venv "${RUNNER_TEMP}/job-venv"
            echo "${RUNNER_TEMP}/job-venv/bin" >> "$GITHUB_PATH"
            echo "VIRTUAL_ENV=${RUNNER_TEMP}/job-venv" >> "$GITHUB_ENV"
          fi
          {
            echo "commit=$EXPECTED_SHA"
            echo "workflow=${GITHUB_WORKFLOW} job=${GITHUB_JOB} run=${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo "runner=${RUNNER_NAME} environment=${RUNNER_ENVIRONMENT} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
            echo "kernel=$(uname -srm)"
            echo "os_release=$(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "cpus=$(nproc)"
            echo "memory=$(free -m | awk '/^Mem:/ {print $2 " MB"}')"
            echo "python=$(python --version 2>&1)"
            echo "git=$(git --version)"
            echo "docker=$(docker --version 2>/dev/null || echo absent)"
            echo "ngspice=$(ngspice --version 2>&1 | sed -n 2p || true)"
          } > "${RUNNER_TEMP}/runner-identity.txt"
          cat "${RUNNER_TEMP}/runner-identity.txt"
      - run: pip install -e ".[dev]"
      - name: split is reproducible from the seed and the rule
        run: |
          python benchmarks/hard/split_hard.py --cases benchmarks/hard/cases_hard \
            --out "${RUNNER_TEMP}/split_check.json"
          python - <<'EOF'
          import json
          a = json.load(open("benchmarks/hard/split_hard.json"))
          import os
          b = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "split_check.json")))
          for k in ("rule_id", "seed", "case_set_digest", "dev_digest", "holdout_digest"):
              assert a[k] == b[k], (k, a[k], b[k])
          print("split reproduced:", a["n_dev"], "dev +", a["n_holdout"], "hold-out")
          EOF
      - name: the seal refuses the full set without --open-holdout
        run: |
          if python benchmarks/hard/score_hard.py --src src \
               --cases benchmarks/hard/cases_hard --workers 4 --split all; then
            echo "SEAL BROKEN: --split all succeeded without --open-holdout"; exit 1
          fi
      - name: the committed benchmark records still reproduce
        run: python -m pytest tests/test_benchmark_records.py -q
      - name: Upload runner identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-identity-${{ github.job }}-${{ github.sha }}
          path: ${{ runner.temp }}/runner-identity.txt
          if-no-files-found: warn
          overwrite: true
          retention-days: 90
