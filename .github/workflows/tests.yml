name: Tests

# FAST tier on every supported Python for every push and PR.
# SCIENTIFIC is also a PR gate (Python 3.12) so model/solver regressions are
# actionable before merge. FULL campaign tests remain a manual freeze check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    name: fast (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Freeze/certificate checks ask whether historical candidate commits are
      # ancestors of HEAD. A depth-1 checkout makes every older candidate look
      # UNRELATED even when the repository relation is valid.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # FAST collects MCP and scientific-truth tests, so both optional groups
      # must be present. The latter hard-imports mpmath during collection.
      - run: pip install -e ".[dev,mcp,oracles]"
      # -n 4, not -n auto: the worker count must not track runner hardware.
      - run: python -m pytest -m "not expensive" -q -n 4 --dist loadfile

  # Mutation guards stay on one interpreter: they verify the guards themselves,
  # not interpreter compatibility. Running the whole mutation campaign twice
  # would add cost without testing a different contract.
  mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp,oracles]"
      - run: python -X utf8 tests/mutation_guards.py "${RUNNER_TEMP}/mutations"

  # This is intentionally a PR gate now. A scientific regression found only
  # after merge is evidence discovered one boundary too late. Keep it on 3.12
  # because FAST owns the supported-Python matrix; this job owns the scientific
  # execution/provider contract.
  scientific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq ngspice
      - run: pip install -e ".[dev,mcp,oracles]"
      - env:
          CRAFTY_NGSPICE_ARGV: ngspice
        run: >
          python -m pytest -m "not campaign" -q -n 4 --dist loadfile
          --deselect tests/test_heterogeneous_ngspice.py::test_a_the_provider_is_a_real_external_process
          --deselect tests/test_heterogeneous_ngspice.py::test_g2_a_genuine_non_zero_exit_is_a_provider_failure
          --deselect tests/test_heterogeneous_ngspice.py::test_j_relocating_the_provider_leaves_the_result_byte_identical

  # Bare-image reproducibility is still a post-merge/manual check. It is not a
  # scientific-code gate and is substantially more expensive than FAST.
  reproduce:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crafty-repro .
      - run: docker run --rm crafty-repro

  # The benchmark is scored on the DEVELOPMENT split only. The 600-case
  # hold-out stays sealed; score_hard.py exits non-zero if this job ever tries
  # to score it without --open-holdout.
  benchmark:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: split is reproducible from the seed and the rule
        run: |
          python benchmarks/hard/split_hard.py --cases benchmarks/hard/cases_hard \
            --out /tmp/split_check.json
          python - <<'EOF'
          import json
          a = json.load(open("benchmarks/hard/split_hard.json"))
          b = json.load(open("/tmp/split_check.json"))
          for k in ("rule_id", "seed", "case_set_digest", "dev_digest", "holdout_digest"):
              assert a[k] == b[k], (k, a[k], b[k])
          print("split reproduced:", a["n_dev"], "dev +", a["n_holdout"], "hold-out")
          EOF
      - name: the seal refuses the full set without --open-holdout
        run: |
          if python benchmarks/hard/score_hard.py --src src \
               --cases benchmarks/hard/cases_hard --workers 4 --split all; then
            echo "SEAL BROKEN: --split all succeeded without --open-holdout"; exit 1
          fi
      - name: the committed benchmark records still reproduce
        run: python -m pytest tests/test_benchmark_records.py -q
