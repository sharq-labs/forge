name: One-off trust repair 5-8

# Trigger commit after the workflow exists on the branch.
on:
  push:
    branches: [chatgpt/core-v2-trust-repair-1-4]
    paths:
      - .github/workflows/oneoff-trust-repair-5-8.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/core-v2-trust-repair-1-4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp]"
      - name: Apply findings 5-8
        run: |
          python tools/_oneoff_trust_repair_5_8.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/hybrid_uq/test_trust_repairs_5_8.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from engcore.hybrid_uq import HybridUQResult, RouteClaim, RouteDecision",
              "from engcore.hybrid_uq import (HybridUQResult, MultistartPolicy, RouteClaim, RouteDecision, local_gaussian_posterior)",
          )
          text = text.replace(
              "    posterior = problem.local_posterior()",
              "    posterior = local_gaussian_posterior(problem.calibrate(), problem.observations, problem.forward, multistart=MultistartPolicy())",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Focused trust tests
        run: >
          python -m pytest
          tests/hybrid_uq/test_trust_repairs_5_8.py
          tests/hybrid_uq/test_hybrid_uq_records.py
          -q
      - name: Commit verified repair
        run: |
          rm tools/_oneoff_trust_repair_5_8.py
          rm .github/workflows/oneoff-trust-repair-5-8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(core): harden trust boundaries 5-8"
          git push origin HEAD:chatgpt/core-v2-trust-repair-1-4
