[project]
name = "forge-code-aster-provider"
version = "0.1.0"
description = "Code_Aster structural provider for Forge (crafty), process-based. Computes; holds no scientific authority."
requires-python = ">=3.10"
# run_aster is an external executable (conda-forge `code-aster`); not a Python dependency.
dependencies = ["crafty"]

[tool.setuptools]
packages = ["forge_code_aster"]
