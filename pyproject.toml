[project]
name = "crafty"
version = "0.4.0"
description = "Crafty — a scientific simulation runtime: universal problem IR, model validity semantics, model/realization/solver separation, cross-domain coupling, provenance and evidence-backed validation beneath AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  # NOTHING IN THIS REPOSITORY IMPORTS THIS, by statement or by string.
  # Every clean install pays for an ~8 MB wheel and its joblib/threadpoolctl
  # tail to satisfy a declaration no code reads. It is left declared rather
  # than dropped because removing a required dependency changes what a clean
  # install contains, which is a decision about the package and not a
  # correction to a record. It is written here, and not only in the guard,
  # because this list is where a reader decides what the package needs.
  # `tests/test_core_guards.py::test_a_declared_dependency_nothing_imports_is_recorded_rather_than_assumed`
  # asserts the unimported set is EXACTLY {mpmath, pytest-xdist, scikit-learn},
  # so if something starts importing it, or a further unused declaration lands,
  # that test fails and this comment gets revisited. `mpmath` is in that set for
  # a different reason than these two — it IS imported, from `benchmarks/`,
  # which that guard's sweep does not walk. The guard's docstring has the
  # detail.
  "scikit-learn>=1.4",
  # Scientific Core units backend. Lower bound only: the platform must not
  # pin its scientific stack to one machine's resolved versions.
  "pint>=0.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # Parallel test execution. Development/test only: no production code imports
  # it, and the suite must remain runnable — and green — without it.
  "pytest-xdist>=3.5",
]

# The MCP boundary. `tests/mcp/test_server.py` has named this group in a comment
# since it was written — "the optional `[mcp]` dependency group" — but the group
# itself did not exist, so there was no supported way to install the SDK and the
# host that had it got it by some route this file did not record.
#
# It is optional rather than a hard dependency because the rule that comment
# states is the right one: the suite must stay runnable, and green, without it.
# `src/engcore/mcp/server.py` is the ONLY module that imports the SDK —
# `battery.py`, `problem.py`, `errors.py` and `evidence.py` do not — so
# everything except the transport itself works on a bare install.
#
# `anyio` is here because `test_server.py` drives the in-process client through
# it. It arrives as an MCP SDK dependency in practice; it is named explicitly
# because the test imports it directly and a transitive dependency is not a
# promise.
mcp = [
  "mcp>=2.1",
  "anyio>=4.0",
]

# The independent-oracle boundary. `benchmarks/scientific_truth/oracles/
# material.py` evaluates the material-resistance reference at 50 significant
# digits to settle whether a double-precision disagreement is the model's or
# the arithmetic's. Without this group installed, that benchmark's test module
# fails to COLLECT — it is a hard import, not a guarded one — which is how it
# arrived undeclared: the round that wrote the oracle ran on a host that had
# mpmath by some route this file did not record.
#
# Optional rather than required for the reason `[mcp]` is: nothing under `src/`
# imports it, so a bare install of the runtime does not need it. It is declared
# rather than left transitive because a dependency nothing names is a
# dependency nobody can reinstall.
oracles = [
  "mpmath>=1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561. The package's inline annotations are part of its interface, and the
# marker only reaches a wheel if it is declared: it is not a module, and nothing
# else here tells setuptools to ship a non-Python file.
[tool.setuptools.package-data]
engcore = ["py.typed"]

[tool.pytest.ini_options]
# The project uses a src/ layout. Tests must resolve engcore from the checked-out
# source tree even when the package has not been installed in editable mode.
#
# "." is here for the top-level `experiments`, `benchmarks` and `tests`
# packages, not for the runtime. It also makes `src` importable, and eleven
# SHA-256-pinned experiment and test files still import `src.engcore`; that
# spelling is an alias for the canonical `engcore` modules (`src/__init__.py`),
# never a second copy of them. The only supported import namespace is `engcore`,
# and `tests/test_trust_boundary_package_identity.py` holds both halves of that.
pythonpath = ["src", "."]

# Execution tiers. Assigned centrally in tests/conftest.py rather than with
# decorators, because two test modules are SHA-256 pinned by frozen experiments
# and must stay byte-identical. See docs/TESTING.md.
markers = [
  "expensive: executes scientific work costing seconds — reproduces a frozen experiment, drives a domain solver, or runs a design study. Excluded from FAST; always runs in SCIENTIFIC and FULL.",
  "campaign: a subset of `expensive` — a large design/discovery campaign or a full stiff-solver ladder run to its budget. Excluded from SCIENTIFIC; always runs in FULL.",
]

# Fail on an unregistered marker rather than warning, so a typo in a tier name
# is caught at collection instead of silently selecting nothing.
filterwarnings = [
  "error::pytest.PytestUnknownMarkWarning",
]
